<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Details | Randstad New Zealand</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="apply">
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">R</span>
        <span class="logo-text">
          <strong>Randstad New Zealand</strong>
          <span>Job &amp; Recruitment Agency</span>
        </span>
      </a>
      <button type="button" class="nav-toggle" aria-label="Open menu">☰</button>
      <nav class="nav-main">
        <a href="index.html">Home</a>
        <a href="categories.html" class="active">Apply</a>
        <a href="faq.html">FAQ</a>
      </nav>
    </div>
  </header>

  <main>
    <nav class="progress-bar" aria-label="Application progress">
      <span class="progress-step done">Home</span>
      <span class="progress-step done">Job type</span>
      <span class="progress-step active">Details</span>
      <span class="progress-step">Documents</span>
      <span class="progress-step">Review</span>
      <span class="progress-step">Done</span>
    </nav>

    <h1 class="section-title">Applicant details</h1>
    <p class="section-subtitle">
      Applying for: <strong id="job-type-label">—</strong>
    </p>

    <form id="application-form" class="form-panel" novalidate>
      <div class="form-grid">
        <div class="form-group">
          <label for="fullName">Full name <span class="required">*</span></label>
          <input type="text" id="fullName" name="fullName" required autocomplete="name" />
          <span class="field-error"></span>
        </div>

        <div class="form-group">
          <label for="email">Email address <span class="required">*</span></label>
          <input type="email" id="email" name="email" required autocomplete="email" />
          <span class="field-error"></span>
        </div>

        <div class="form-group">
          <label for="phone">Phone number <span class="required">*</span></label>
          <input type="tel" id="phone" name="phone" required placeholder="+64 21 000 0000" autocomplete="tel" />
          <span class="field-error"></span>
        </div>

        <div class="form-group">
          <label for="nationality">Nationality <span class="required">*</span></label>
          <select id="nationality" name="nationality" data-country-select required></select>
          <span class="field-error"></span>
        </div>

        <div class="form-group">
          <label for="countryOfResidence">Country of residence <span class="required">*</span></label>
          <select id="countryOfResidence" name="countryOfResidence" data-country-select required></select>
          <span class="field-error"></span>
        </div>

        <div class="form-group">
          <label for="desiredCategory">Desired job category <span class="required">*</span></label>
          <select id="desiredCategory" name="desiredCategory" required></select>
          <span class="field-error"></span>
        </div>

        <div class="form-group full-width">
          <label for="skillsExperience">Skills or work experience <span class="required">*</span></label>
          <textarea id="skillsExperience" name="skillsExperience" rows="5" required placeholder="Describe your relevant skills, roles, and years of experience…"></textarea>
          <span class="field-error"></span>
        </div>

        <div class="form-group">
          <label for="educationLevel">Education level <span class="required">*</span></label>
          <select id="educationLevel" name="educationLevel" required></select>
          <span class="field-error"></span>
        </div>
      </div>

      <div class="btn-group">
        <button type="button" id="btn-back-category" class="btn btn-ghost">Back</button>
        <button type="submit" class="btn btn-primary">Continue to documents</button>
      </div>
    </form>
  </main>

  <footer class="site-footer">
    <p class="footer-bottom">&copy; 2026 Randstad New Zealand.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
